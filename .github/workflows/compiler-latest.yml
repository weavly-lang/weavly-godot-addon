name: Compiler latest

# The CI job pins the compiler so an upstream release cannot fail unrelated PRs.
# This run is where a new release shows up instead.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade weavly
      - run: weavly --version
      - name: Rebuild the fixtures from their .wvl sources
        run: |
          for src in $(find test/fixtures ci/export_smoke -type d -name src | sort); do
            echo "Building $(dirname "$src")"
            (cd "$(dirname "$src")" && weavly build)
          done
      - name: Fail if the newest compiler emits different JSON
        run: |
          git add -A test/fixtures ci/export_smoke
          git diff --cached --exit-code -- test/fixtures ci/export_smoke
