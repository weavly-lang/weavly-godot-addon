name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit
      - run: gdlint .
      - run: gdformat --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: "4.5"
            version: "4.5.2"
          - godot: "4.6"
            version: "4.6.3"
          - godot: "4.7"
            version: "4.7.2"
    name: test (Godot ${{ matrix.godot }})
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.version }}
          version: installed
          paths: res://test
          report-name: Test report (Godot ${{ matrix.godot }})
