name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdtoolkit
      - run: gdlint .
      - run: gdformat --check .

  fixtures:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install weavly==0.3.0
      - name: Rebuild the fixtures from their .wvl sources
        run: weavly build
        working-directory: test/fixtures/integration/ci_smoke
      - name: Fail if the built JSON differs from what is committed
        run: |
          git add -A test/fixtures/integration/ci_smoke/build
          git diff --cached --exit-code -- test/fixtures/integration/ci_smoke/build

  test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: "4.5"
            version: "4.5.2"
          - godot: "4.6"
            version: "4.6.3"
          - godot: "4.7"
            version: "4.7.2"
    name: test (Godot ${{ matrix.godot }})
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: ${{ matrix.version }}
          version: installed
          paths: res://test
          report-name: Test report (Godot ${{ matrix.godot }})

  export:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - godot: "4.5"
            version: "4.5.2"
          - godot: "4.7"
            version: "4.7.2"
    name: export (Godot ${{ matrix.godot }})
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.version }}
          use-dotnet: false
          include-templates: true
      - name: Install the addon into the test game
        run: |
          mkdir -p ci/export_smoke/addons
          cp -r addons/weavly ci/export_smoke/addons/weavly
      - name: Import the test game
        run: godot --headless --path ci/export_smoke --import
      - name: Export the Linux build
        run: |
          mkdir -p build/linux
          godot --headless --path ci/export_smoke --export-release Linux "$GITHUB_WORKSPACE/build/linux/smoke.x86_64"
      - name: Place the external media next to the executable
        run: cp -r ci/external_media build/linux/external_media
      - name: Run the exported game
        run: |
          chmod +x build/linux/smoke.x86_64
          timeout 120 build/linux/smoke.x86_64 --headless
